<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: url('2_20250812_124300_0001.png') no-repeat center center/cover;
      position: relative;
      overflow: hidden;
    }

    /* Lapisan gelap supaya teks lebih terlihat */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
    }

    .container {
      position: relative;
      z-index: 2;
      animation: fadeIn 1.5s ease-in-out;
    }

    h1 {
      font-size: 5rem;
      margin: 0;
      animation: bounce 2s infinite;
    }

    p {
      font-size: 1.5rem;
      margin-top: 10px;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: #ff4d4d;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      transition: 0.3s;
    }

    a:hover {
      background: #ff1a1a;
      transform: scale(1.05);
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-20px);
      }
      60% {
        transform: translateY(-10px);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>😢 404</h1>
    <p>Sorry, the page you’re looking for doesn’t exist.</p>
    <a href="/">Go Back Home</a>
  </div>
</body>
</html>
